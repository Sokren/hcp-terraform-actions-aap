---
- name: Deploy website update
  hosts: all
  become: yes
  gather_facts: no

  pre_tasks:
    - name: Wait for system to become reachable
      wait_for_connection:
        delay: 10
        timeout: 120

    - name: Wait for cloud-init to complete
      command: cloud-init status --wait
      changed_when: false
      become: yes
      ignore_errors: yes

    - name: Gather facts after waiting
      setup:

  tasks:
    - name: Deploy new website version
      copy:
        src: "{{ playbook_dir }}/../website/"
        dest: "/var/www/html"
        owner: apache
        group: apache
        mode: '0755'
      notify: Restart httpd

    - name: Inject OS version into the website
      ansible.builtin.replace:
        path: /var/www/html/index.html
        regexp: '__OS_VERSION__'
        replace: "{{ ansible_distribution }} {{ ansible_distribution_version }}"
      notify: Restart httpd

  handlers:
    - name: Restart httpd
      ansible.builtin.service:
        name: httpd
        state: restarted